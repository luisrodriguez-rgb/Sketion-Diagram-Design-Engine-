Resultado Sketion: Tablero A3 con cuello de botella y 4 soluciones.</text>
  <rect x="975.0" y="785.0" width="865.0" height="145.0" rx="6.0" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5" />
  <rect x="987.0" y="795.0" width="88.0" height="20.0" rx="6.0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.0" />
  <text x="991.0" y="807.0" fill="#475569" font-size="10px" font-weight="400">ESTRATEGIA</text>
  <text x="989.0" y="836.0" fill="#0F172A" font-size="13px" font-weight="400">3. Equipos &amp; Estrategia</text>
  <text x="989.0" y="856.5" fill="#475569" font-size="12px" font-weight="400">Tu Pedido: &#x27;Aclara qué le toca hacer a Ventas, Soporte y Finanzas.&#x27;
Resultado Sketion: Carriles de responsabilidad con roles claros.</text>
  <rect x="975.0" y="960.0" width="865.0" height="145.0" rx="6.0" fill="#FFFFFF" stroke="#0C0C0C" stroke-width="1.5" />
  <rect x="987.0" y="970.0" width="88.0" height="20.0" rx="6.0" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.0" />
